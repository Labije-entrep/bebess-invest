# =====================================================================
#  ENGLISH CONTENT — mirrors src/data/fr/cabinet.yaml
#  ---------------------------------------------------------------------
#  Only fields that need translating appear here. Anything left out
#  falls back to the French file, which is what we want for values that
#  are the same in both languages: telephone number, email address,
#  ORIAS registration number, and so on. Never copy those here, or they
#  will have to be maintained twice.
#
#  Every value starting with "A COMPLETER" shows up underlined in gold
#  on the English site. Replace them; when no gold is left, the English
#  version is ready to publish (see src/data/site.yaml).
# =====================================================================

