preuves:
  - titre: "Indépendance"
    texte: "Aucun réseau bancaire, aucun produit maison imposé."
  - titre: "Conservation des fonds"
    texte: "Vos avoirs restent chez votre dépositaire. Je ne détiens aucun fonds."
  - titre: "Cadre réglementaire"
    texte: "A COMPLETER : statut et numéro ORIAS"
  - titre: "Assurance"
    texte: "A COMPLETER : responsabilité civile professionnelle"

missions:
  - etiquette: "Cadrage"
    titre: "Comprendre avant d'allouer"
    texte: >-
      Inventaire des actifs, horizon réel de chaque poche, contraintes fiscales et
      familiales, tolérance au risque exprimée en euros et non en adjectifs. Le
      cadrage est écrit et signé avant tout arbitrage.
  - etiquette: "Allocation"
    titre: "Construire l'architecture"
    texte: >-
      Répartition stratégique entre poches de liquidité, de rendement et de
      croissance, puis sélection des supports : indiciel, gestion active, non
      coté, immobilier. Chaque choix est motivé par écrit, frais compris.
  - etiquette: "Suivi"
    titre: "Tenir la ligne dans le temps"
    texte: >-
      Point trimestriel, rééquilibrage documenté, alerte en cas d'écart
      significatif avec le cadrage initial. L'absence de mouvement est aussi une
      décision — elle est justifiée comme les autres.
  - etiquette: "Coordination"
    titre: "Parler à vos autres conseils"
    texte: >-
      Notaire, expert-comptable, avocat, banquier : j'assure la cohérence entre
      les décisions patrimoniales et le reste de votre organisation, et je
      consolide les positions éparpillées.

methode:
  - titre: "Entretien de cadrage"
    texte: >-
      Inventaire complet : comptes titres, assurance-vie, PER, immobilier,
      participations, crédits en cours. Nous fixons les horizons et les montants
      plancher dont vous devez disposer à chaque échéance. Durée : une à deux
      séances.
  - titre: "Note d'allocation"
    texte: >-
      Un document écrit qui pose la répartition cible, les supports retenus, les
      frais réels de chaque ligne et les scénarios de baisse envisagés. Vous le
      signez — ou vous demandez qu'on le reprenne.
  - titre: "Mise en œuvre"
    texte: >-
      Ouverture ou transfert des enveloppes, arbitrages étalés dans le temps
      quand les montants le justifient, et consolidation des positions
      existantes dans un tableau unique.
  - titre: "Suivi trimestriel"
    texte: >-
      Un compte rendu écrit tous les trois mois : performance nette de frais,
      écarts par rapport à la cible, mouvements proposés. Un point annuel plus
      long remet le cadrage à jour.

honoraires:
  - etiquette: "Mission de cadrage"
    montant: "A COMPLETER : honoraire forfaitaire"
    texte: "Facturé une fois, indépendamment de la suite donnée. Vous repartez avec la note, même si vous ne confiez rien."
  - etiquette: "Suivi de portefeuille"
    montant: "A COMPLETER : % des encours par an"
    texte: "Prélevé selon une périodicité définie au mandat, détaillé sur chaque compte rendu trimestriel."
  - etiquette: "Rétrocessions"
    montant: "A COMPLETER : politique à préciser"
    texte: "Le détail des commissions éventuellement perçues des producteurs figure au document d'entrée en relation."

clienteles:
