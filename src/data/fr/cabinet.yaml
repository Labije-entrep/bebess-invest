convictions:
  - rang: "I"
    titre: "Les frais se disent d'abord"
    texte: "Un rendement annoncé brut de frais n'est pas un rendement. Toute proposition chiffrée que je remets est nette."
  - rang: "II"
    titre: "Écrit, donc opposable"
    texte: "Ce qui n'est pas écrit n'engage personne. Cadrage, allocation, arbitrages : tout passe par un document daté."
  - rang: "III"
    titre: "Dire non fait partie du conseil"
    texte: "Certains montages sont bons pour celui qui les vend. Si votre situation ne justifie rien, je vous le dis et nous en restons là."

faq:
  - question: "Qui détient mon argent ?"
    reponse: >-
      Pas moi. Vos avoirs restent déposés chez l'établissement teneur de compte ou
      l'assureur, à votre nom. Mon rôle est de conseiller et d'arbitrer dans ce
      cadre, jamais d'encaisser vos fonds.
  - question: "À partir de quel montant est-ce pertinent ?"
    reponse: "A COMPLETER : montant plancher à fixer, ou formulation du type « en dessous d'un certain encours, les honoraires pèsent plus que le gain attendu — je vous le dirai franchement lors du premier échange »."
  - question: "Comment êtes-vous rémunéré ?"
    reponse: "A COMPLETER : honoraires de conseil, frais sur encours, ou combinaison des deux. Le détail figure au document d'entrée en relation, remis avant toute signature."
  - question: "Puis-je partir quand je veux ?"
    reponse: "A COMPLETER : préavis et modalités selon la lettre de mission. Les enveloppes restent les vôtres : vous récupérez la main sans transfert d'actifs imposé."
  - question: "Que se passe-t-il si les marchés baissent fortement ?"
    reponse: >-
      Le scénario a été chiffré avec vous au moment du cadrage, en euros sur votre
      propre portefeuille. En cas de baisse marquée, je reprends ce document avec
      vous plutôt que d'improviser une réaction. Les investissements présentent un
      risque de perte en capital, et aucune allocation ne l'annule.

