    titre: "Faire travailler une épargne qui dort"
    texte: "Des revenus confortables, des liquidités mal placées et pas le temps d'arbitrer. L'enjeu est de structurer sans ajouter de charge mentale."
  - etiquette: "Dirigeants"
    titre: "Préparer une cession"
    texte: "Articuler trésorerie d'entreprise, patrimoine personnel et fiscalité de sortie, plusieurs années avant l'opération."
  - etiquette: "Familles"
    titre: "Transmettre sans casse"
    texte: "Organiser la détention, anticiper les droits et éviter que la transmission ne devienne un sujet de conflit."

