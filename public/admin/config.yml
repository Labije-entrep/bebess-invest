# =====================================================================
#  CONFIGURATION DU CMS  —  https://<le-site>/admin
#  ---------------------------------------------------------------------
#  Modele de roles :
#    · vous      : proprietaire du depot, vous fusionnez et deployez
#    · le client : collaborateur, il redige et envoie en relecture
#  La branche main est protegee : toute contribution passe par une
#  pull request que vous validez. Rien ne part en ligne sans vous.
# =====================================================================

backend:
  name: github
  repo: VOTRE-COMPTE/bebess-invest      # <-- a renseigner
  branch: main
  # URL du Worker Cloudflare « Sveltia CMS Authenticator » qui porte
  # l'authentification GitHub. Voir README, section CMS.
  base_url: https://VOTRE-WORKER.workers.dev   # <-- a renseigner

# Toute modification cree une pull request au lieu d'ecrire sur main.
publish_mode:
  type: editorial_workflow
  # Le client ne peut pas fusionner : la protection de branche l'en empeche.
  direct_publish: false

locale: fr
site_url: https://www.bebess-invest.fr
display_url: https://www.bebess-invest.fr
logo_url: /favicon.svg

# Edition bilingue : les deux langues s'affichent cote a cote dans le
# meme formulaire, ce qui evite de publier en francais et d'oublier l'anglais.
i18n:
  structure: multiple_folders      # src/content/notes/<langue>/<slug>.md
  locales: [fr, en]
  default_locale: fr

media_folder: public/img
public_folder: /img

collections:
  # -------------------------------------------------------------------
  #  NOTES DE MARCHE — le client redige, vous validez
  # -------------------------------------------------------------------
  - name: notes
    label: Notes de marché
    label_singular: Note
    folder: src/content/notes
    create: true
    i18n: true
    slug: '{{year}}-{{month}}-{{slug}}'
    preview_path: 'notes/{{slug}}'
    summary: '{{titre}}'
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: Titre de la note, widget: string, hint: "Une question précise plutôt qu'un thème général." , i18n: true }
      - { name: date, label: Date de publication, widget: datetime, date_format: 'DD/MM/YYYY', time_format: false, picker_utc: false , i18n: duplicate }
      - { name: chapeau, label: Chapeau, widget: text, hint: "Deux phrases maximum : ce que le lecteur va y trouver. Affiché dans la liste des notes." , i18n: true }
      - { name: description, label: Description pour les moteurs de recherche, widget: string, required: false, hint: '155 caractères maximum. Si vide, le chapeau est utilisé.' , i18n: true }
      - { name: publie, label: Visible sur le site, widget: boolean, default: true , i18n: duplicate }
      - { name: body, label: Corps de la note, widget: markdown , i18n: true }

  # -------------------------------------------------------------------
  #  REGLAGES — informations du cabinet
  # -------------------------------------------------------------------
  - name: reglages
    label: Réglages du site
    files:
      - name: cabinet
        label: Informations du cabinet (français)
        file: src/data/fr/cabinet.yaml
        description: >-
          Tout ce qui s'affiche sur le site hors notes de marché. Les champs
          laissés avec la mention « A COMPLETER » apparaissent soulignés en doré
          sur le site, afin de repérer ce qui manque.
        fields:
          - { name: nom, label: Nom du cabinet, widget: string }
          - { name: baseline, label: Baseline, widget: string }
          - { name: accroche, label: Titre d'accueil, widget: string }
          - { name: accrocheAccent, label: Mot mis en valeur dans le titre, widget: string, hint: "Ce mot s'affiche en italique doré. Il doit figurer dans le titre ci-dessus." }
          - { name: resume, label: Paragraphe d'introduction, widget: text }

          - name: dirigeant
            label: Dirigeant
            widget: object
            fields:
              - { name: nom, label: Prénom et nom, widget: string }
              - { name: titre, label: Fonction, widget: string }
              - { name: accroche, label: Phrase de présentation, widget: text }
              - { name: faits, label: Points clés, widget: list, field: { name: fait, label: Point, widget: string } }
              - { name: portrait, label: Portrait, widget: image, required: false, hint: "Laissez vide tant que la photo n'est pas réalisée : un cadre d'attente s'affiche." }
              - { name: portraitAlt, label: Description de la photo, widget: string, required: false, hint: 'Pour les lecteurs d''écran et les moteurs de recherche.' }

          - name: contact
            label: Coordonnées
            widget: object
            fields:
              - { name: email, label: E-mail, widget: string }
              - { name: telephone, label: Téléphone, widget: string }
              - { name: adresse, label: Adresse, widget: string }
              - { name: codePostalVille, label: Code postal et ville, widget: string }
              - { name: ville, label: Ville affichée en haut d'accueil, widget: string }
              - { name: linkedin, label: URL LinkedIn, widget: string, required: false }
              - { name: delaiReponse, label: Délai de réponse annoncé, widget: string }
              - { name: endpointFormulaire, label: URL du formulaire (Formspree), widget: string, required: false }
              - { name: lienRendezVous, label: Lien de prise de rendez-vous, widget: string, required: false }

          - name: legal
            label: Mentions légales et statut réglementaire
            widget: object
            collapsed: true
            fields:
              - { name: formeJuridique, label: Forme juridique et capital, widget: string }
              - { name: rcs, label: RCS, widget: string }
              - { name: tva, label: TVA intracommunautaire, widget: string }
              - { name: ape, label: Code APE, widget: string }
              - { name: directeurPublication, label: Directeur de la publication, widget: string }
              - { name: statut, label: Statut exercé, widget: string }
              - { name: orias, label: Numéro ORIAS, widget: string }
              - { name: association, label: Association professionnelle et n° d'adhérent, widget: string }
              - { name: rcp, label: Responsabilité civile professionnelle, widget: string }
              - { name: garantieFinanciere, label: Garantie financière, widget: string }
              - { name: mediateur, label: Médiateur de la consommation, widget: string }
              - { name: hebergeur, label: Hébergeur, widget: string }
              - { name: conservationDonnees, label: Conservation des données, widget: string }
              - { name: avertissementRisque, label: Avertissement sur les risques, widget: text }

          - name: preuves
            label: Bandeau de réassurance (accueil)
            widget: list
            fields:
              - { name: titre, label: Intitulé, widget: string }
              - { name: texte, label: Texte, widget: text }

          - name: missions
            label: Missions prises en charge
            widget: list
            fields:
              - { name: etiquette, label: Étiquette, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }

          - name: methode
            label: Méthode en quatre temps
            widget: list
            hint: "L'ordre de la liste donne la numérotation affichée."
            fields:
              - { name: titre, label: Titre de l'étape, widget: string }
              - { name: texte, label: Texte, widget: text }

          - name: honoraires
            label: Honoraires
            widget: list
            fields:
              - { name: etiquette, label: Nature, widget: string }
              - { name: montant, label: Montant affiché, widget: string }
              - { name: texte, label: Précision, widget: text }

          - name: clienteles
            label: Profils de clientèle
            widget: list
            fields:
              - { name: etiquette, label: Profil, widget: string }
              - { name: titre, label: Préoccupation, widget: string }
              - { name: texte, label: Texte, widget: text }

          - name: jalons
            label: Parcours professionnel
            widget: list
            fields:
              - { name: annee, label: Période, widget: string }
              - { name: titre, label: Poste ou diplôme, widget: string }
              - { name: lieu, label: Établissement et ville, widget: string }
              - { name: texte, label: Ce que l'étape a apporté, widget: text }

          - name: convictions
            label: Convictions
            widget: list
            fields:
              - { name: rang, label: Numéro romain, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }

          - name: faq
            label: Questions fréquentes
            widget: list
            hint: 'Ces questions et réponses alimentent aussi les résultats enrichis de Google.'
            fields:
              - { name: question, label: Question, widget: string }
              - { name: reponse, label: Réponse, widget: text }

          - name: objetsContact
            label: Choix proposés dans le formulaire
            widget: list
            field: { name: objet, label: Objet, widget: string }

      - name: seo
        label: Titres et descriptions des pages (français)
        file: src/data/fr/seo.yaml
        description: 'Ce qui apparaît dans les résultats Google. Titre sous 60 caractères, description sous 155.'
        fields:
          - { name: accueil, label: Accueil, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: approche, label: Approche, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: parcours, label: Parcours, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: notes, label: Notes, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: contact, label: Contact, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: mentions, label: Mentions légales, widget: object, fields: [{ name: titre, label: Titre, widget: string }, { name: description, label: Description, widget: text }] }

      # ---- version anglaise -------------------------------------------
      # Seuls les champs a traduire figurent ici. Tout champ laisse vide
      # reprend la valeur francaise : ne recopiez pas le telephone, l'ORIAS
      # ou l'adresse e-mail, ils seraient a maintenir deux fois.
      - name: cabinet_en
        label: Cabinet information (English)
        file: src/data/en/cabinet.yaml
        fields:
          - { name: baseline, label: Tagline, widget: string }
          - { name: accroche, label: Homepage headline, widget: string }
          - { name: accrocheAccent, label: Word highlighted in gold, widget: string }
          - { name: resume, label: Opening paragraph, widget: text }
          - name: dirigeant
            label: Principal
            widget: object
            fields:
              - { name: titre, label: Job title, widget: string }
              - { name: accroche, label: Introduction, widget: text }
              - { name: faits, label: Key points, widget: list, field: { name: fait, label: Point, widget: string } }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: delaiReponse, label: Reply time, widget: string }
          - name: legal
            label: Legal and regulatory
            widget: object
            collapsed: true
            fields:
              - { name: statut, label: Regulatory status, widget: string }
              - { name: association, label: Professional association, widget: string }
              - { name: rcp, label: Professional indemnity insurance, widget: string }
              - { name: garantieFinanciere, label: Financial guarantee, widget: string }
              - { name: mediateur, label: Consumer ombudsman, widget: string }
              - { name: conservationDonnees, label: Data retention, widget: string }
              - { name: avertissementRisque, label: Risk warning, widget: text }
          - name: preuves
            label: Trust strip
            widget: list
            fields: [{ name: titre, label: Label, widget: string }, { name: texte, label: Text, widget: text }]
          - name: missions
            label: Engagements
            widget: list
            fields: [{ name: etiquette, label: Tag, widget: string }, { name: titre, label: Title, widget: string }, { name: texte, label: Text, widget: text }]
          - name: methode
            label: Method
            widget: list
            fields: [{ name: titre, label: Step, widget: string }, { name: texte, label: Text, widget: text }]
          - name: honoraires
            label: Fees
            widget: list
            fields: [{ name: etiquette, label: Type, widget: string }, { name: montant, label: Amount, widget: string }, { name: texte, label: Detail, widget: text }]
          - name: clienteles
            label: Client profiles
            widget: list
            fields: [{ name: etiquette, label: Profile, widget: string }, { name: titre, label: Concern, widget: string }, { name: texte, label: Text, widget: text }]
          - name: jalons
            label: Track record
            widget: list
            fields: [{ name: annee, label: Period, widget: string }, { name: titre, label: Role, widget: string }, { name: lieu, label: Institution, widget: string }, { name: texte, label: Text, widget: text }]
          - name: convictions
            label: Convictions
            widget: list
            fields: [{ name: rang, label: Numeral, widget: string }, { name: titre, label: Title, widget: string }, { name: texte, label: Text, widget: text }]
          - name: faq
            label: Frequently asked questions
            widget: list
            fields: [{ name: question, label: Question, widget: string }, { name: reponse, label: Answer, widget: text }]
          - name: objetsContact
            label: Contact form subjects
            widget: list
            field: { name: objet, label: Subject, widget: string }

      - name: seo_en
        label: Page titles and descriptions (English)
        file: src/data/en/seo.yaml
        fields:
          - { name: accueil, label: Home, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: approche, label: Approach, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: parcours, label: About, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: notes, label: Insights, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: contact, label: Contact, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
          - { name: mentions, label: Legal notice, widget: object, fields: [{ name: titre, label: Title, widget: string }, { name: description, label: Description, widget: text }] }
