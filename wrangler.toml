# Le site : un projet Cloudflare PAGES. Pages n'accepte pas de Cron Trigger (wrangler refuse `[triggers]` dans ce fichier) : le traitement
# quotidien du lot 12 a son propre Worker, wrangler.cron.toml, qui partage la même base D1 et le même bucket R2.
name = "bebess"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "bebess"
database_id = "A_REMPLIR"

# Fichiers (lot 08) : rapports des viewers, logos. Aucun domaine public ni accès r2.dev sur ce bucket :
# les objets ne sortent que par les routes du Worker, après contrôle de session, de locataire et de rôle.
[[r2_buckets]]
binding = "FICHIERS"
bucket_name = "bebess-fichiers"
